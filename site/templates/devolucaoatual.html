<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Devolução de obras</title>
  <style>
    /* Mesmo layout dos formulários anteriores */
    body { font-family: Arial, sans-serif; background:#B5B5B5; margin:20px; text-align:center; }
    .container { max-width: 860px; margin: 0 auto; background:#fff; padding:20px; border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.08); }
    h2 { margin-top: 0; }
    form { text-align:left; }
    .row { display:flex; gap:12px; margin-bottom:12px; align-items:center; }
    .row label { width:220px; text-align:right; font-weight:bold; }
    .row input { flex:1; padding:8px; border:1px solid #ddd; border-radius:8px; }
    .actions { display:flex; gap:12px; justify-content:center; margin-top:16px; }
    button { padding:10px 16px; border:0; border-radius:8px; cursor:pointer; }
    .btn-primary { background:#0d6efd; color:#fff; }
    .btn-secondary { background:#6c757d; color:#fff; }
    .status { margin-top:16px; font-weight:bold; text-align:center; }
    .hint { font-size:12px; color:#555; margin-top:6px; text-align:left; }
    table { width:100%; border-collapse:collapse; margin-top:16px; border-radius:8px; overflow:hidden; }
    th, td { border:1px solid #eee; padding:10px; text-align:left; }
    th { background:#f7f7f7; }

    /* Modal */
    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); }
    .modal-conteudo { background:#fff; width:min(520px, 90%); margin:15% auto; padding:20px; border-radius:8px; position:relative; text-align:left; }
    .fechar-modal { position:absolute; right:14px; top:8px; cursor:pointer; font-size:20px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Devolução de obras</h2>
    <form id="formDevolucao" novalidate>
      <!-- Filtros -->
      <div class="row">
        <label for="isbn">ISBN (preencha para localizar):</label>
        <input type="text" id="isbn" name="isbn" placeholder="Ex.: 9781234567897" />
      </div>
      <div class="row">
        <label for="codigo_biblioteca">Código da biblioteca (preencha para localizar):</label>
        <input type="text" id="codigo_biblioteca" name="codigo_biblioteca" placeholder="Ex.: BIB-0001" />
      </div>
      <p class="hint">Você pode informar apenas <strong>ISBN</strong>, apenas <strong>Código da biblioteca</strong> ou os dois para refinar.</p>

      <!-- Dados auto-preenchidos do empréstimo selecionado -->
      <div class="row">
        <label for="titulo">Título da obra:</label>
        <input type="text" id="titulo" name="titulo" placeholder="(auto)" readonly />
      </div>
      <div class="row">
        <label for="autor">Autor:</label>
        <input type="text" id="autor" name="autor" placeholder="(auto)" readonly />
      </div>
      <div class="row">
        <label for="ano">Ano:</label>
        <input type="text" id="ano" name="ano" placeholder="(auto)" readonly />
      </div>
      <div class="row">
        <label for="nome_aluno">Nome do aluno:</label>
        <input type="text" id="nome_aluno" name="nome_aluno" placeholder="(auto)" readonly />
      </div>
      <div class="row">
        <label for="matricula">Matrícula:</label>
        <input type="text" id="matricula" name="matricula" placeholder="(auto)" readonly />
      </div>
      <div class="row">
        <label for="data_emprestimo">Data do empréstimo:</label>
        <input type="text" id="data_emprestimo" name="data_emprestimo" placeholder="(auto)" readonly />
      </div>
      <div class="row">
        <label for="data_prevista">Data prevista de devolução:</label>
        <input type="text" id="data_prevista" name="data_prevista" placeholder="(auto)" readonly />
      </div>

      <div class="actions">
        <button type="submit" class="btn-primary">Devolver</button>
        <button type="button" id="btnLocalizar" class="btn-secondary">Localizar</button>
        <button type="button" id="btnLimpar" class="btn-secondary">Limpar</button>
      </div>
    </form>

    <div id="status" class="status" aria-live="polite"></div>
    <!-- Lista de possíveis empréstimos para seleção (quando houver mais de 1) -->
    <div id="matches"></div>
  </div>

  <!-- Modal -->
  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-conteudo" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
      <span class="fechar-modal" title="Fechar">&times;</span>
      <h3 id="modal-titulo">Aviso</h3>
      <p id="modal-texto">Mensagem</p>
    </div>
  </div>

  <!-- Acessibilidade (opcional) -->
  <script src="https://cdn.jsdelivr.net/npm/sienna-accessibility@latest/dist/sienna-accessibility.umd.js" defer></script>
  <div vw class="enabled"><div vw-access-button class="active"></div><div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div></div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script> new window.VLibras.Widget('https://vlibras.gov.br/app'); </script>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://wghuaeupfgszfmxdbvsz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndnaHVhZXVwZmdzemZteGRidnN6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI2NDQxMTIsImV4cCI6MjA3ODIyMDExMn0.UZrPpVK_JlsvTJkXxlXfFOGyAWPKwUaSbMaF1oqkHx0';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // UI refs
    const form = document.getElementById('formDevolucao');
    const btnLocalizar = document.getElementById('btnLocalizar');
    const btnLimpar = document.getElementById('btnLimpar');
    const statusEl = document.getElementById('status');
    const matchesEl = document.getElementById('matches');

    const modal = document.getElementById('modal');
    const modalTexto = document.getElementById('modal-texto');
    const modalTitulo = document.getElementById('modal-titulo');
    const fecharModalBtn = document.querySelector('.fechar-modal');

    // Campos
    const isbnEl = document.getElementById('isbn');
    const codBibEl = document.getElementById('codigo_biblioteca');

    const tituloEl = document.getElementById('titulo');
    const autorEl = document.getElementById('autor');
    const anoEl = document.getElementById('ano');

    const nomeAlunoEl = document.getElementById('nome_aluno');
    const matriculaEl = document.getElementById('matricula');

    const dataEmpEl = document.getElementById('data_emprestimo');
    const dataPrevEl = document.getElementById('data_prevista');

    // Estado atual
    let selectedLoan = null; // objeto do empréstimo enriquecido (com obra/aluno)

    function abrirModal(titulo, msg){ modalTitulo.textContent = titulo; modalTexto.textContent = msg; modal.style.display='block'; modal.setAttribute('aria-hidden','false'); }
    function fecharModal(){ modal.style.display='none'; modal.setAttribute('aria-hidden','true'); }
    fecharModalBtn.addEventListener('click', fecharModal);
    window.addEventListener('click', (e)=>{ if(e.target === modal) fecharModal(); });

    function limparUI(){
      statusEl.textContent = '';
      matchesEl.innerHTML = '';
      selectedLoan = null;
      // limpa campos auto
      [tituloEl, autorEl, anoEl, nomeAlunoEl, matriculaEl, dataEmpEl, dataPrevEl].forEach(el => el.value = '');
    }

    function normalizeIsbn(v){ return (v || '').toUpperCase().replace(/[^0-9X]/g,''); }

    function renderMatches(lista){
      if(!lista || !lista.length){ matchesEl.innerHTML = ''; return; }
      const rows = lista.map(l => `
        <tr>
          <td>${l.obra?.titulo || ''}</td>
          <td>${l.obra?.isbn || ''}</td>
          <td>${l.aluno?.nome || ''}</td>
          <td>${l.aluno?.matricula || ''}</td>
          <td>${new Date(l.data_emprestimo).toLocaleString('pt-BR')}</td>
          <td>${new Date(l.data_prevista_devolucao).toLocaleString('pt-BR')}</td>
          <td><button type="button" class="btn-primary select-loan" data-id="${l.id}">Selecionar</button></td>
        </tr>
      `).join('');
      matchesEl.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Título</th>
              <th>ISBN</th>
              <th>Aluno</th>
              <th>Matrícula</th>
              <th>Data empréstimo</th>
              <th>Prevista devolução</th>
              <th>Ação</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    function preencherCamposComLoan(l){
      if(!l) return;
      tituloEl.value = l.obra?.titulo || '';
      autorEl.value = l.obra?.autor || '';
      anoEl.value = l.obra?.ano || '';
      nomeAlunoEl.value = l.aluno?.nome || '';
      matriculaEl.value = l.aluno?.matricula || '';
      dataEmpEl.value = new Date(l.data_emprestimo).toLocaleString('pt-BR');
      dataPrevEl.value = new Date(l.data_prevista_devolucao).toLocaleString('pt-BR');
    }

    // Busca empréstimos ativos pelo ISBN/código
    async function localizarEmprestimos(){
      limparUI();
      const isbnRaw = (isbnEl.value || '').trim();
      const codRaw = (codBibEl.value || '').trim();

      if(!isbnRaw && !codRaw){
        abrirModal('Atenção','Informe ISBN e/ou Código da biblioteca para localizar.');
        return;
      }

      statusEl.textContent = 'Localizando empréstimos...';

      // Monta filtro básico
      let q = supabase
        .from('emprestimos')
        .select('id,aluno_id,obra_id,isbn,codigo_biblioteca,data_emprestimo,data_prevista_devolucao,data_devolucao,status')
        .is('data_devolucao', null); // apenas ativos

      if(isbnRaw) q = q.eq('isbn', normalizeIsbn(isbnRaw));
      if(codRaw)  q = q.eq('codigo_biblioteca', codRaw);

      const { data: loans, error } = await q;
      if(error){
        console.error(error);
        statusEl.textContent = '';
        abrirModal('Erro', 'Falha ao consultar empréstimos.');
        return;
      }

      if(!loans || !loans.length){
        statusEl.textContent = '';
        abrirModal('Sem resultados', 'Nenhum empréstimo ativo encontrado com esses dados.');
        return;
      }

      // Carrega obras e alunos em lote
      const obraIds = [...new Set(loans.map(l => l.obra_id))];
      const alunoIds = [...new Set(loans.map(l => l.aluno_id))];

      const [{ data: obras }, { data: alunos }] = await Promise.all([
        supabase.from('obras').select('id,titulo,autor,ano,isbn').in('id', obraIds),
        supabase.from('alunos').select('id,nome,matricula,codigo_biblioteca').in('id', alunoIds),
      ]);

      const mapObra = new Map((obras || []).map(o => [o.id, o]));
      const mapAluno = new Map((alunos || []).map(a => [a.id, a]));

      const enriched = (loans || []).map(l => ({
        ...l,
        obra: mapObra.get(l.obra_id) || null,
        aluno: mapAluno.get(l.aluno_id) || null,
      }));

      statusEl.textContent = `Encontrado(s): ${enriched.length}`;
      if(enriched.length === 1){
        selectedLoan = enriched[0];
        preencherCamposComLoan(selectedLoan);
      } else {
        // Mostra lista para selecionar
        renderMatches(enriched);
      }
    }

    // Clique no botão "Selecionar" da lista
    matchesEl.addEventListener('click', (e) => {
      const btn = e.target.closest('.select-loan');
      if(!btn) return;
      const id = btn.getAttribute('data-id');
      // Procura o empréstimo mostrado na tabela
      const rows = matchesEl.querySelectorAll('tbody tr');
      // Não temos os objetos guardados aqui; refaça a busca rápida via DOM? Melhor guardar globalmente.
      // Para simplicidade, refaremos a localização:
      (async () => {
        const { data } = await supabase.from('emprestimos').select('*').eq('id', id).limit(1);
        if(!data || !data.length){ abrirModal('Erro','Não foi possível selecionar.'); return; }
        const loan = data[0];

        const [{ data: o }, { data: a }] = await Promise.all([
          supabase.from('obras').select('id,titulo,autor,ano,isbn').eq('id', loan.obra_id).limit(1),
          supabase.from('alunos').select('id,nome,matricula,codigo_biblioteca').eq('id', loan.aluno_id).limit(1),
        ]);

        selectedLoan = {
          ...loan,
          obra: o && o[0] ? o[0] : null,
          aluno: a && a[0] ? a[0] : null,
        };
        preencherCamposComLoan(selectedLoan);
        matchesEl.innerHTML = ''; // esconde a lista após seleção
        statusEl.textContent = 'Um empréstimo foi selecionado.';
      })();
    });

    // Botões
    btnLocalizar.addEventListener('click', localizarEmprestimos);
    btnLimpar.addEventListener('click', () => {
      form.reset();
      limparUI();
    });

    // Submeter = devolver
    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      if(!selectedLoan){
        abrirModal('Atenção','Localize e selecione um empréstimo antes de devolver.');
        return;
      }
      statusEl.textContent = 'Registrando devolução...';

      const nowIso = new Date().toISOString();
      const { error } = await supabase
        .from('emprestimos')
        .update({ data_devolucao: nowIso, status: 'DEVOLVIDO' })
        .eq('id', selectedLoan.id)
        .is('data_devolucao', null); // garante que ainda está ativo

      if(error){
        console.error(error);
        statusEl.textContent = '';
        abrirModal('Erro ao devolver', 'Não foi possível atualizar. ' + (error.message || ''));
        return;
      }

      statusEl.textContent = '';
      abrirModal('Sucesso', 'Devolução registrada com sucesso! ✅');
      form.reset();
      limparUI();
    });

    // Também tente localizar ao sair dos campos
    isbnEl.addEventListener('blur', ()=>{ if(isbnEl.value.trim()) localizarEmprestimos(); });
    codBibEl.addEventListener('blur', ()=>{ if(codBibEl.value.trim()) localizarEmprestimos(); });
  </script>
</body>
</html>
