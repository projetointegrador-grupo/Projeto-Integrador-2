<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Consulta de alunos</title>
  <style>
    /* Mesmo layout da consulta anterior */
    body { font-family: Arial, sans-serif; background:#B5B5B5; margin:20px; text-align:center; }
    .container { max-width: 860px; margin: 0 auto; background:#fff; padding:20px; border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.08); }
    h2 { margin-top: 0; }
    form { text-align:left; }
    .row { display:flex; gap:12px; margin-bottom:12px; align-items:center; }
    .row label { width:220px; text-align:right; font-weight:bold; }
    .row input { flex:1; padding:8px; border:1px solid #ddd; border-radius:8px; }
    .actions { display:flex; gap:12px; justify-content:center; margin-top:16px; }
    button { padding:10px 16px; border:0; border-radius:8px; cursor:pointer; }
    .btn-primary { background:#0d6efd; color:#fff; }
    .btn-secondary { background:#6c757d; color:#fff; }
    .status { margin-top:16px; font-weight:bold; }
    .hint { font-size:12px; color:#555; margin-top:6px; text-align:left; }
    table { width:100%; border-collapse:collapse; margin-top:16px; border-radius:8px; overflow:hidden; }
    th, td { border:1px solid #eee; padding:10px; text-align:left; }
    th { background:#f7f7f7; }

    /* Modal simples para mensagens */
    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); }
    .modal-conteudo { background:#fff; width:min(520px, 90%); margin:15% auto; padding:20px; border-radius:8px; position:relative; text-align:left; }
    .fechar-modal { position:absolute; right:14px; top:8px; cursor:pointer; font-size:20px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Consulta de alunos</h2>
    <form id="formConsultaAluno" novalidate>
      <div class="row">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Ex.: Ana Souza" />
      </div>
      <div class="row">
        <label for="endereco">Endereço:</label>
        <input type="text" id="endereco" name="endereco" placeholder="Ex.: Rua das Flores, 123" />
      </div>
      <div class="row">
        <label for="matricula">Matrícula:</label>
        <input type="text" id="matricula" name="matricula" placeholder="Ex.: 2025A001" />
      </div>
      <div class="row">
        <label for="codigo_biblioteca">Código da biblioteca:</label>
        <input type="text" id="codigo_biblioteca" name="codigo_biblioteca" placeholder="Ex.: BIB-0001" />
      </div>
      <p class="hint">A busca usa <strong>OU</strong> entre os campos informados (ex.: “nome OU matrícula”).</p>
      <div class="actions">
        <button type="submit" class="btn-primary">Consultar</button>
        <button type="button" id="btnLimpar" class="btn-secondary">Limpar</button>
      </div>
    </form>

    <div id="status" class="status" aria-live="polite"></div>
    <div id="resultado"></div>
  </div>

  <!-- Modal -->
  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-conteudo" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
      <span class="fechar-modal" title="Fechar">&times;</span>
      <h3 id="modal-titulo">Aviso</h3>
      <p id="modal-texto">Mensagem</p>
    </div>
  </div>

  <!-- (Opcional) Acessibilidade -->
  <script src="https://cdn.jsdelivr.net/npm/sienna-accessibility@latest/dist/sienna-accessibility.umd.js" defer></script>
  <div vw class="enabled"><div vw-access-button class="active"></div><div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div></div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script> new window.VLibras.Widget('https://vlibras.gov.br/app'); </script>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://wghuaeupfgszfmxdbvsz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndnaHVhZXVwZmdzemZteGRidnN6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI2NDQxMTIsImV4cCI6MjA3ODIyMDExMn0.UZrPpVK_JlsvTJkXxlXfFOGyAWPKwUaSbMaF1oqkHx0';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // UI refs
    const form = document.getElementById('formConsultaAluno');
    const statusEl = document.getElementById('status');
    const resultadoEl = document.getElementById('resultado');
    const btnLimpar = document.getElementById('btnLimpar');

    const modal = document.getElementById('modal');
    const modalTexto = document.getElementById('modal-texto');
    const fecharModalBtn = document.querySelector('.fechar-modal');
    function abrirModal(msg){ modalTexto.textContent = msg; modal.style.display='block'; modal.setAttribute('aria-hidden','false'); }
    function fecharModal(){ modal.style.display='none'; modal.setAttribute('aria-hidden','true'); }
    fecharModalBtn.addEventListener('click', fecharModal);
    window.addEventListener('click', (e)=>{ if(e.target===modal) fecharModal(); });

    function limparUI(){ statusEl.textContent=''; resultadoEl.innerHTML=''; }

    function renderTabela(dados){
      if(!dados || !dados.length){
        resultadoEl.innerHTML = '<p>Nenhum registro encontrado.</p>';
        return;
      }
      const linhas = dados.map(r => `
        <tr>
          <td>${r.nome ?? ''}</td>
          <td>${r.endereco ?? ''}</td>
          <td>${r.matricula ?? ''}</td>
          <td>${r.codigo_biblioteca ?? ''}</td>
          <td>${new Date(r.created_at).toLocaleString('pt-BR')}</td>
        </tr>
      `).join('');
      resultadoEl.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>Endereço</th>
              <th>Matrícula</th>
              <th>Código da biblioteca</th>
              <th>Criado em</th>
            </tr>
          </thead>
          <tbody>${linhas}</tbody>
        </table>
      `;
    }

    // Evita quebra da sintaxe do OR do PostgREST
    function sanitizeForOrLike(v){
      return v.replace(/[*"%]/g, '').replace(/[(),]/g, ' ');
    }

    // Consulta com OR + ilike
    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      limparUI();

      const nome  = (document.getElementById('nome').value||'').trim();
      const endereco = (document.getElementById('endereco').value||'').trim();
      const matricula = (document.getElementById('matricula').value||'').trim();
      const codigo_biblioteca = (document.getElementById('codigo_biblioteca').value||'').trim();

      if(!nome && !endereco && !matricula && !codigo_biblioteca){
        abrirModal('Informe ao menos um campo para consultar.');
        return;
      }

      statusEl.textContent = 'Consultando...';
      try {
        let query = supabase
          .from('alunos')
          .select('id,nome,endereco,matricula,codigo_biblioteca,created_at', { count: 'exact' })
          .order('created_at', { ascending: false })
          .limit(50);

        const parts = [];
        if (nome) parts.push(`nome.ilike.*${sanitizeForOrLike(nome)}*`);
        if (endereco) parts.push(`endereco.ilike.*${sanitizeForOrLike(endereco)}*`);
        if (matricula) parts.push(`matricula.ilike.*${sanitizeForOrLike(matricula)}*`);
        if (codigo_biblioteca) parts.push(`codigo_biblioteca.ilike.*${sanitizeForOrLike(codigo_biblioteca)}*`);
        if (parts.length) query = query.or(parts.join(','));

        const { data, error, count } = await query;
        if (error) {
          console.error(error);
          statusEl.textContent = 'Erro na consulta.';
          abrirModal('Erro ao consultar: ' + error.message);
          return;
        }

        statusEl.textContent = `Encontrados: ${count ?? data.length}`;
        renderTabela(data);
      } catch (e) {
        console.error(e);
        statusEl.textContent = 'Falha inesperada.';
        abrirModal('Falha inesperada ao consultar. Tente novamente.');
      }
    });

    btnLimpar.addEventListener('click', ()=>{ form.reset(); limparUI(); });
  </script>
</body>
</html>
